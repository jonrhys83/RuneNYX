# Static site in site/, functions in functions/ - deliberately separate.
# Netlify skips a functions directory nested inside the publish directory and
# silently ships a deploy with zero functions.

[build]
  publish = "site"
  functions = "functions"

# --- schedules (UTC) ---
# Jagex updates the GE around 18:00 UTC, so the 07:00 run picks up the previous
# day's update. Each later job is offset enough that the one before it is done.

# 1. Fetch the dump, archive it, ingest it.
[functions."ge-pull"]
  schedule = "0 7 * * *"

# 2. Write today's calls from the fresh snapshot.
[functions."ge-signal-background"]
  background = true
  schedule = "19 7 * * *"

# 3. Grade every call whose 7-day horizon has elapsed. Runs on its own
#    schedule so a broken emit never stops the track record accumulating.
[functions."ge-score"]
  schedule = "41 7 * * *"

# 3b. Real traded prices, hourly. Separate from everything above because it
#     tracks the actual market rather than Jagex's once-a-day guide price.
#
#     The schedule sits on a tick wrapper rather than on ge-rt itself, because
#     Netlify refuses public HTTP access to any function with a schedule - it
#     answers 403. Keeping ge-rt unscheduled leaves it callable by hand for
#     verification and gap-filling.
[functions."ge-rt-tick"]
  schedule = "4 * * * *"

# 4. Mondays: weekly OHLC bars, prune daily rows past HOT_RETENTION_DAYS.
[functions."ge-rollup"]
  schedule = "30 8 * * 1"

# 5. Sundays: refresh wiki reference data (shops, drops, locations).
[functions."wiki-sync-background"]
  background = true
  schedule = "0 9 * * 0"

# Long-running work.
[functions."ge-ingest-background"]
  background = true

[functions."ge-restore-background"]
  background = true
