<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RuneNYX — Grand Exchange research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141210;
    --parchment:#e8e0cf;
    --parchment-dim:#d6cbb3;
    --rule:#bfb094;
    --gold:#a8842c;
    --rise:#3f6b46;
    --fall:#8f3222;
    --pin:#7a3d8c;
    --muted:#6e6558;
    --panel:#f3eee1;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--parchment); color:var(--ink);
    font:400 15px/1.5 "IBM Plex Mono", ui-monospace, monospace;
  }
  header{border-bottom:2px solid var(--ink); padding:20px 20px 0}
  .top{display:flex; flex-wrap:wrap; gap:14px; align-items:baseline; margin-bottom:14px}
  h1{font:700 30px/1 "Bitter", Georgia, serif; margin:0; letter-spacing:-.02em}
  h1 span{color:var(--gold)}
  .stamp{margin-left:auto; font-size:12px; color:var(--muted); text-align:right}

  nav{display:flex; gap:2px; flex-wrap:wrap}
  nav button{
    font:500 13px/1 "IBM Plex Mono", monospace;
    padding:11px 16px; cursor:pointer;
    background:transparent; color:var(--muted);
    border:1px solid var(--rule); border-bottom:none;
    border-radius:3px 3px 0 0; margin-bottom:-1px;
  }
  nav button[aria-selected=true]{
    background:var(--parchment); color:var(--ink);
    border-color:var(--ink); border-bottom:1px solid var(--parchment);
    font-weight:600;
  }

  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    padding:14px 20px; border-bottom:1px solid var(--rule);
  }
  input,select{
    font:inherit; font-size:13px; padding:7px 10px;
    background:var(--panel); color:var(--ink);
    border:1px solid var(--rule); border-radius:0;
  }
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold); outline-offset:1px}
  input[type=search]{min-width:210px; flex:1; max-width:340px}
  .chip{
    font:500 12px/1 "IBM Plex Mono", monospace;
    padding:8px 12px; cursor:pointer;
    background:transparent; color:var(--muted); border:1px solid var(--rule);
  }
  .chip[aria-pressed=true]{background:var(--ink); color:var(--parchment); border-color:var(--ink)}
  .hint{font-size:12px; color:var(--muted); padding:10px 20px 0; max-width:86ch}
  .hint b{color:var(--ink); font-weight:600}

  .wrap{padding:0 20px 60px}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th{
    text-align:right; font-weight:600; font-size:11px; letter-spacing:.07em;
    text-transform:uppercase; color:var(--muted);
    padding:12px 8px; border-bottom:1px solid var(--ink);
    position:sticky; top:0; background:var(--parchment); cursor:pointer; white-space:nowrap;
  }
  th.txt{text-align:left}
  th[aria-sort]{color:var(--ink)}
  th[aria-sort=descending]::after{content:" \2193"}
  th[aria-sort=ascending]::after{content:" \2191"}
  td{padding:9px 8px; text-align:right; border-bottom:1px solid var(--parchment-dim); white-space:nowrap}
  td.txt{text-align:left; white-space:normal}
  td.name{font-family:"Bitter",Georgia,serif; font-size:14px}
  tbody tr:hover{background:#f0e9d9}
  .up{color:var(--rise)} .down{color:var(--fall)}
  .members::after{content:" \2605"; color:var(--gold); font-size:10px}
  .badge{
    display:inline-block; padding:1px 5px; margin-left:6px;
    font-size:10px; letter-spacing:.05em; color:#fff; background:var(--pin);
  }
  .sub{color:var(--muted); font-size:11px}
  .note{padding:36px 20px; color:var(--muted); font-size:14px; max-width:64ch}
  .note b{color:var(--ink)}
  code{background:var(--panel); padding:1px 4px; border:1px solid var(--rule); font-size:12px}
  @media (max-width:820px){ .hide-sm{display:none} h1{font-size:24px} }
  @media (prefers-reduced-motion:no-preference){ tbody tr{transition:background .12s} }
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>Rune<span>NYX</span></h1>
    <span class="stamp" id="stamp">loading&hellip;</span>
  </div>
  <nav id="tabs" role="tablist">
    <button role="tab" data-tab="screener" aria-selected="true">Screener</button>
    <button role="tab" data-tab="vendor"   aria-selected="false">Vendor flips</button>
    <button role="tab" data-tab="farm"     aria-selected="false">Farm &amp; steal</button>
    <button role="tab" data-tab="lookup"   aria-selected="false">Where to get</button>
  </nav>
</header>

<div class="controls" id="controls"></div>
<div class="hint" id="hint"></div>

<div class="wrap">
  <table>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="note" id="note" hidden></div>
</div>

<script type="module">
const URL_ = "https://hhnkjtbqeaegdxfoyuok.supabase.co";
const KEY  = "sb_publishable_5KPQJAErYqd41xgrsI81lw_WYjfTKXt";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (m) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[m]));

const gp = (n) => {
  if (n == null || n === "") return "\u2014";
  n = Number(n);
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(2) + "b";
  if (a >= 1e6) return (n / 1e6).toFixed(2) + "m";
  if (a >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(Math.round(n));
};
const pct = (n) => n == null ? "\u2014" : (n > 0 ? "+" : "") + Number(n).toFixed(1) + "%";
const num = (n, d = 1) => n == null ? "\u2014" : Number(n).toFixed(d);

async function api(path) {
  const res = await fetch(`${URL_}/rest/v1/${path}`, {
    headers: { apikey: KEY, Authorization: `Bearer ${KEY}`, Prefer: "count=exact" },
  });
  if (!res.ok) throw new Error(`${res.status} \u2014 ${(await res.text()).slice(0, 140)}`);
  const total = (res.headers.get("content-range") || "").split("/")[1];
  return { rows: await res.json(), total: total && total !== "*" ? +total : null };
}

const state = { tab: "screener", sort: null, dir: -1, filters: {}, q: "" };

const TABS = {
  screener: {
    view: "v_screener",
    sort: "volume",
    hint: "Guide price and how it moved since the last GE update. <b>Liq</b> is daily volume divided by your 4-hour buy limit \u2014 under 5 and you cannot fill a limit without moving the price yourself. <b>CAP</b> means the item is pinned at the 5% daily guide-price cap, so the real market has moved further than the number shows.",
    controls: [
      { kind:"search", ph:"Search item name" },
      { kind:"chip", key:"pinned",  label:"Pinned at 5% cap", q:"pinned_at_cap=is.true" },
      { kind:"chip", key:"cheap",   label:"Below 30d average", q:"z=lte.-1" },
      { kind:"chip", key:"members", label:"Members only",      q:"members=is.true" },
      { kind:"select", key:"vol", q:(v)=>`volume=gte.${v}`, def:"1000",
        opts:[["0","Any volume"],["100","100+ /day"],["1000","1,000+ /day"],["10000","10,000+ /day"]] },
      { kind:"select", key:"cap", q:(v)=>v==="0"?"":`capital=lte.${v}`, def:"0",
        opts:[["0","Any capital"],["1000000","\u2264 1m to fill limit"],["10000000","\u2264 10m"],["100000000","\u2264 100m"]] },
    ],
    search: "name",
    cols: [
      { k:"name", t:"Item", txt:true, cls:"name", r:(r)=>
        `<span class="${r.members?"members":""}">${esc(r.name)}</span>` +
        (r.pinned_at_cap ? '<span class="badge">CAP</span>' : "") },
      { k:"price", t:"Price", r:(r)=>gp(r.price) },
      { k:"chg_pct", t:"Day", r:(r)=>
        `<span class="${r.chg_pct>0?"up":r.chg_pct<0?"down":""}">${pct(r.chg_pct)}</span>` },
      { k:"z", t:"Z", sm:true, r:(r)=>num(r.z,2) },
      { k:"volume", t:"Volume", r:(r)=>gp(r.volume) },
      { k:"buy_limit", t:"Limit", sm:true, r:(r)=>r.buy_limit ?? "\u2014" },
      { k:"liquidity", t:"Liq", sm:true, r:(r)=>num(r.liquidity) },
      { k:"capital", t:"Capital", sm:true, r:(r)=>gp(r.capital) },
    ],
  },

  vendor: {
    view: "v_vendor_flips",
    sort: "margin",
    hint: "Items an NPC shop sells below the Grand Exchange price. The real constraint is restock rate, not price \u2014 shops refill slowly, so treat this as a list worth checking rather than guaranteed profit. High <b>volume</b> matters more than a fat margin on something nobody buys.",
    controls: [
      { kind:"search", ph:"Search item name" },
      { kind:"chip", key:"members", label:"Members only", q:"members_only=is.true" },
      { kind:"select", key:"vol", q:(v)=>`volume=gte.${v}`, def:"500",
        opts:[["0","Any volume"],["500","500+ /day"],["5000","5,000+ /day"],["50000","50,000+ /day"]] },
      { kind:"select", key:"marg", q:(v)=>v==="0"?"":`margin=gte.${v}`, def:"0",
        opts:[["0","Any margin"],["1000","1k+ margin"],["10000","10k+"],["100000","100k+"]] },
    ],
    search: "item_name",
    cols: [
      { k:"item_name", t:"Item", txt:true, cls:"name", r:(r)=>esc(r.item_name) },
      { k:"shop_name", t:"Shop", txt:true, r:(r)=>
        `${esc(r.shop_name)}<br><span class="sub">${esc(r.location || r.owner || "")}</span>` },
      { k:"shop_cost", t:"Shop cost", r:(r)=>gp(r.shop_cost) },
      { k:"ge_price", t:"GE price", r:(r)=>gp(r.ge_price) },
      { k:"margin", t:"Margin", r:(r)=>`<span class="up">${gp(r.margin)}</span>` },
      { k:"margin_pct", t:"Margin %", sm:true, r:(r)=>num(r.margin_pct) + "%" },
      { k:"stock", t:"Stock", sm:true, r:(r)=>r.stock ?? "\u2014" },
      { k:"volume", t:"Volume", r:(r)=>gp(r.volume) },
    ],
  },

  farm: {
    view: "v_farm_value",
    sort: "gp_per_action",
    hint: "What one kill, steal or search is worth on average, with drop rarity already factored in. <b>Per action</b> is the expected value; <b>when it drops</b> is what the item sells for on the occasions it lands. Check <b>volume</b> before committing an hour \u2014 a thin market collapses if you dump hundreds into it.",
    controls: [
      { kind:"search", ph:"Search source, e.g. stall" },
      { kind:"select", key:"type", q:(v)=>v==="all"?"":`source_type=eq.${v}`, def:"thieving",
        opts:[["thieving","Thieving"],["combat","Combat"],["search","Searchable"],["all","All sources"]] },
      { kind:"select", key:"vol", q:(v)=>`volume=gte.${v}`, def:"1000",
        opts:[["0","Any volume"],["1000","1,000+ /day"],["10000","10,000+ /day"],["100000","100,000+ /day"]] },
      { kind:"chip", key:"guaranteed", label:"Guaranteed drops only", q:"rarity_p=eq.1" },
    ],
    search: "source_name",
    cols: [
      { k:"source_name", t:"Source", txt:true, cls:"name", r:(r)=>
        `${esc(r.source_name)}<br><span class="sub">${esc(r.region || r.source_type || "")}</span>` },
      { k:"item_name", t:"Item", txt:true, r:(r)=>esc(r.item_name) },
      { k:"rarity", t:"Rarity", txt:true, sm:true, r:(r)=>esc(r.rarity) },
      { k:"gp_per_action", t:"Per action", r:(r)=>gp(r.gp_per_action) },
      { k:"gp_when_dropped", t:"When it drops", sm:true, r:(r)=>gp(r.gp_when_dropped) },
      { k:"price", t:"Price", r:(r)=>gp(r.price) },
      { k:"volume", t:"Volume", r:(r)=>gp(r.volume) },
    ],
  },

  lookup: {
    view: "v_where_to_get",
    sort: "item_name",
    dir: 1,
    hint: "Every known way to obtain an item \u2014 shops, monsters, thieving, gathering. Type an item name to narrow it down.",
    controls: [ { kind:"search", ph:"Item name, e.g. Silk" } ],
    search: "item_name",
    cols: [
      { k:"item_name", t:"Item", txt:true, cls:"name", r:(r)=>esc(r.item_name) },
      { k:"via", t:"Via", txt:true, r:(r)=>esc(r.via) },
      { k:"source", t:"Source", txt:true, r:(r)=>esc(r.source) },
      { k:"location", t:"Where", txt:true, r:(r)=>esc(r.location || "\u2014") },
      { k:"detail", t:"Detail", txt:true, sm:true, r:(r)=>esc(r.detail || "\u2014") },
      { k:"cost", t:"Shop cost", r:(r)=>r.cost == null ? "\u2014" : gp(r.cost) },
    ],
  },
};

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function buildControls() {
  const cfg = TABS[state.tab];
  $("hint").innerHTML = cfg.hint;
  $("controls").innerHTML = cfg.controls.map((c) => {
    if (c.kind === "search")
      return `<input type="search" id="q" placeholder="${c.ph}" autocomplete="off" value="${esc(state.q)}">`;
    if (c.kind === "chip")
      return `<button class="chip" data-chip="${c.key}" aria-pressed="${!!state.filters[c.key]}">${c.label}</button>`;
    const cur = state.filters[c.key] ?? c.def;
    return `<select data-sel="${c.key}">` + c.opts.map(([v, l]) =>
      `<option value="${v}"${v === cur ? " selected" : ""}>${l}</option>`).join("") + "</select>";
  }).join("");

  $("q") && $("q").addEventListener("input", debounce((e) => {
    state.q = e.target.value; load();
  }, 300));
  document.querySelectorAll("[data-chip]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.chip;
    state.filters[k] = !state.filters[k];
    b.setAttribute("aria-pressed", String(state.filters[k]));
    load();
  }));
  document.querySelectorAll("[data-sel]").forEach((s) => s.addEventListener("change", () => {
    state.filters[s.dataset.sel] = s.value;
    load();
  }));
}

function buildHead() {
  const cfg = TABS[state.tab];
  $("head").innerHTML = cfg.cols.map((c) =>
    `<th data-k="${c.k}" class="${c.txt ? "txt" : ""}${c.sm ? " hide-sm" : ""}"` +
    (state.sort === c.k ? ` aria-sort="${state.dir === 1 ? "ascending" : "descending"}"` : "") +
    `>${c.t}</th>`).join("");
  document.querySelectorAll("th").forEach((th) => th.addEventListener("click", () => {
    const k = th.dataset.k;
    state.dir = state.sort === k ? -state.dir : -1;
    state.sort = k;
    buildHead();
    load();
  }));
}

function query() {
  const cfg = TABS[state.tab];
  const parts = ["select=*"];
  for (const c of cfg.controls) {
    if (c.kind === "chip" && state.filters[c.key]) parts.push(c.q);
    if (c.kind === "select") {
      const v = state.filters[c.key] ?? c.def;
      const q = typeof c.q === "function" ? c.q(v) : c.q;
      if (q) parts.push(q);
    }
  }
  const term = state.q.trim();
  if (term) parts.push(`${cfg.search}=ilike.*${encodeURIComponent(term)}*`);
  parts.push(`order=${state.sort}.${state.dir === 1 ? "asc" : "desc"}.nullslast`);
  parts.push("limit=250");
  return `${cfg.view}?${parts.join("&")}`;
}

function show(html) {
  $("note").hidden = false;
  $("note").innerHTML = html;
  $("rows").innerHTML = "";
}

async function load() {
  const cfg = TABS[state.tab];
  try {
    const { rows, total } = await api(query());
    if (!rows.length) {
      show("<b>Nothing matches those filters.</b> Try loosening the volume or margin limit.");
      $("stamp").textContent = "0 rows";
      return;
    }
    $("note").hidden = true;
    $("rows").innerHTML = rows.map((r) =>
      "<tr>" + cfg.cols.map((c) =>
        `<td class="${c.txt ? "txt" : ""}${c.cls ? " " + c.cls : ""}${c.sm ? " hide-sm" : ""}">${c.r(r)}</td>`
      ).join("") + "</tr>").join("");
    $("stamp").innerHTML = total && total > rows.length
      ? `showing ${rows.length} of ${total.toLocaleString()}`
      : `${rows.length.toLocaleString()} rows`;
  } catch (e) {
    show(`<b>Could not reach the database.</b> ${esc(e.message)}<br><br>` +
      "If the screener is empty, the daily pull has not run yet. Trigger it with " +
      "<code>curl -X POST https://runenyx.netlify.app/.netlify/functions/ge-ingest-background</code>");
    $("stamp").textContent = "offline";
  }
}

function selectTab(name) {
  state.tab = name;
  state.filters = {};
  state.q = "";
  state.sort = TABS[name].sort;
  state.dir = TABS[name].dir ?? -1;
  document.querySelectorAll("[data-tab]").forEach((b) =>
    b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  buildControls();
  buildHead();
  load();
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]");
  if (b) selectTab(b.dataset.tab);
});

selectTab("screener");
</script>
</body>
</html>
